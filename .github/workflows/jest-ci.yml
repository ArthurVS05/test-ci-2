name: jest-and-docker-ci

on: push

jobs:
  test-client:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Goto client and run tests
        run: cd client && npm i && npm test
  docker:
    # Se lance si job précédent s'est exécuté avec succès
    needs: test-client
    # On build seulement l'image docker au merge sur main
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          # Indique où se trouve l'app à builder
          context: "{{defaultContext}}:client"
          # DockerHub user's name and app's name
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/quete1902:latest
